<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 نظام إدارة بطولة الإسكواش الاحترافي - 3D Edition</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
    background: radial-gradient(circle at top right, #1e293b, #0f172a, #020617);
    color: #f8fafc;
    min-height: 100vh;
    line-height: 1.6;
    perspective: 1000px;
    background-attachment: fixed;
}

/* ===== إخفاء أزرار الأسهم من حقول الأرقام ===== */
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}
input[type="number"] {
    -moz-appearance: textfield;
    appearance: textfield;
}

#inputScreen {
    max-width: 920px;
    margin: 50px auto;
    background: rgba(30, 41, 59, 0.75);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.125);
    border-radius: 24px;
    padding: 40px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    transform-style: preserve-3d;
    transition: transform 0.5s ease;
}

.input-header {
    text-align: center;
    margin-bottom: 30px;
    padding-bottom: 25px;
    border-bottom: 2px solid rgba(255, 255, 255, 0.1);
}

.input-header .logo-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 10px;
}

.input-header .logo-area svg { width: 75px; height: 75px; filter: drop-shadow(0 10px 15px rgba(16, 185, 129, 0.4)); }

.input-header .logo-area .author {
    font-size: 15px;
    font-style: italic;
    font-weight: bold;
    color: #38bdf8;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

.input-header h1 {
    font-size: 34px;
    color: #10b981;
    margin: 12px 0;
    font-weight: 900;
    text-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
}

.input-header p {
    font-size: 15px;
    color: #94a3b8;
}

.btn-import-main {
    display: block;
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #0288d1 0%, #01579b 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 25px;
    box-shadow: 0 10px 20px rgba(2, 136, 209, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    transition: all 0.3s ease;
}

.btn-import-main:hover {
    transform: translateY(-3px) scale(1.01);
    box-shadow: 0 15px 25px rgba(2, 136, 209, 0.5);
}

.section-box {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.2);
}

.section-box .section-title {
    font-size: 18px;
    font-weight: bold;
    color: #f59e0b;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.section-box .section-title.green { color: #10b981; }

.radio-option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px;
    cursor: pointer;
    border-radius: 10px;
    transition: background 0.2s;
}

.radio-option:hover { background: rgba(255, 255, 255, 0.05); }

.radio-option input[type="radio"] {
    accent-color: #10b981;
    width: 20px;
    height: 20px;
    margin-top: 2px;
}

.radio-option label {
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    color: #f8fafc;
}

.players-label {
    font-size: 15px;
    font-weight: bold;
    color: #f8fafc;
    margin-bottom: 10px;
}

#txtNames {
    width: 100%;
    height: 220px;
    background: rgba(15, 23, 42, 0.8);
    color: #f8fafc;
    border: 2px solid #334155;
    border-radius: 12px;
    padding: 15px;
    font-family: inherit;
    font-size: 15px;
    resize: vertical;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
}

#txtNames:focus {
    border-color: #10b981;
    box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
}

#lblCount {
    font-size: 15px;
    font-weight: bold;
    color: #38bdf8;
    margin-top: 10px;
    padding: 10px;
    background: rgba(15, 23, 42, 0.6);
    border-radius: 8px;
    text-align: center;
}

.settings-row {
    display: flex;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

.settings-row label {
    font-size: 15px;
    font-weight: bold;
    color: #f59e0b;
}

.settings-row .radio-inline {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
}

.settings-row .radio-inline input { accent-color: #10b981; }

.checkbox-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
    flex-wrap: wrap;
}

.checkbox-row label { font-size: 14px; color: #f8fafc; }

.checkbox-row input[type="checkbox"] {
    accent-color: #10b981;
    width: 18px;
    height: 18px;
}

.checkbox-row input[type="number"] {
    width: 70px;
    padding: 6px 10px;
    background: #0f172a;
    color: white;
    border: 1px solid #334155;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
}

.checkbox-row input[type="number"]:disabled { opacity: 0.4; }

.btn-generate {
    display: block;
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 25px;
    box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    transition: all 0.3s ease;
}

.btn-generate:hover {
    transform: translateY(-3px) scale(1.01);
    box-shadow: 0 15px 30px rgba(16, 185, 129, 0.6);
}

#dashboard { display: none; }

.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(30, 41, 59, 0.85);
    backdrop-filter: blur(12px);
    padding: 15px 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    flex-wrap: wrap;
    gap: 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.top-bar-right { display: flex; align-items: center; gap: 15px; }

.top-bar .logo-small {
    display: flex;
    align-items: center;
    gap: 10px;
}

.top-bar .logo-small svg { width: 45px; height: 45px; }

.top-bar .logo-small .author {
    font-size: 13px;
    font-style: italic;
    font-weight: bold;
    color: #38bdf8;
}

.top-bar .mode-title {
    font-size: 18px;
    font-weight: 800;
    color: white;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

.top-bar-btns { display: flex; gap: 10px; flex-wrap: wrap; }

.btn-top {
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    color: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: all 0.2s ease;
}

.btn-top:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.3); }
.btn-home { background: linear-gradient(135deg, #f59e0b, #d97706); }
.btn-rules { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
.btn-export { background: linear-gradient(135deg, #10b981, #059669); }
.btn-import { background: linear-gradient(135deg, #0288d1, #01579b); }

.tabs-container {
    display: flex;
    background: rgba(15, 23, 42, 0.6);
    padding: 10px 20px 0;
    gap: 8px;
    flex-wrap: wrap;
    border-bottom: 2px solid #334155;
}

.tab-btn {
    padding: 14px 28px;
    background: rgba(30, 41, 59, 0.7);
    color: #94a3b8;
    border: none;
    border-radius: 12px 12px 0 0;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
}

.tab-btn:hover { background: #334155; color: white; }
.tab-btn.active {
    background: linear-gradient(135deg, #10b981, #059669);
    color: white;
    box-shadow: 0 -4px 15px rgba(16, 185, 129, 0.3);
}

.tab-content { display: none; padding: 25px; min-height: 600px; }
.tab-content.active { display: block; }

/* ===== 3D Match Cards & Components ===== */
.group-controls {
    background: rgba(30, 41, 59, 0.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.group-controls .ctrl-title {
    font-size: 16px;
    font-weight: bold;
    color: #38bdf8;
    margin-bottom: 15px;
}

.ctrl-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
}

.ctrl-row label { font-size: 14px; font-weight: bold; color: white; }

.ctrl-row input[type="text"] {
    padding: 8px 12px;
    background: #0f172a;
    color: white;
    border: 1px solid #334155;
    border-radius: 6px;
    font-size: 14px;
    width: 150px;
    outline: none;
}

.ctrl-row select {
    padding: 8px 12px;
    background: #0f172a;
    color: white;
    border: 1px solid #334155;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    min-width: 130px;
}

.btn-add { background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
.btn-remove { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
.btn-transfer { background: #0288d1; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }

.table-section {
    background: rgba(30, 41, 59, 0.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.table-title {
    font-size: 18px;
    font-weight: bold;
    color: #10b981;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.table-title::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 25px;
    background: #10b981;
    border-radius: 4px;
    box-shadow: 0 0 10px #10b981;
}

.standings-table { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 14px; }

.standings-table thead th {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    padding: 12px 10px;
    text-align: center;
    font-weight: bold;
}

.standings-table tbody tr {
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.2s;
}

.standings-table tbody tr:hover { transform: scale(1.01); }

.standings-table tbody td {
    padding: 12px;
    text-align: center;
    background: rgba(15, 23, 42, 0.7);
    color: white;
}

.standings-table tbody tr.qualified td { background: rgba(6, 78, 59, 0.8); color: #34d399; font-weight: bold; }

.matches-section {
    background: rgba(30, 41, 59, 0.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.matches-title {
    font-size: 18px;
    font-weight: bold;
    color: #f59e0b;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.matches-title::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 25px;
    background: #f59e0b;
    border-radius: 4px;
    box-shadow: 0 0 10px #f59e0b;
}

.match-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.8));
    padding: 16px 20px;
    border-radius: 14px;
    margin-bottom: 14px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
    transition: all 0.3s ease;
    transform-style: preserve-3d;
    flex-wrap: wrap;
}

.match-card:hover {
    transform: translateY(-4px) translateZ(10px);
    box-shadow: 0 15px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    border-color: rgba(56, 189, 248, 0.4);
}

.match-card.completed {
    border-color: #10b981;
    background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(6, 78, 59, 0.8) 100%);
    box-shadow: 0 8px 20px rgba(16, 185, 129, 0.2);
}

.match-number {
    font-size: 13px;
    font-weight: bold;
    color: #38bdf8;
    min-width: 80px;
    padding: 8px 12px;
    background: rgba(56, 189, 248, 0.1);
    border-radius: 8px;
    text-align: center;
    border: 1px solid rgba(56, 189, 248, 0.2);
}

.match-player {
    font-size: 15px;
    font-weight: bold;
    color: #f8fafc;
    min-width: 150px;
    padding: 10px 14px;
    background: rgba(30, 41, 59, 0.9);
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: all 0.3s;
}

.match-player.winner {
    color: #34d399;
    background: rgba(6, 78, 59, 0.9);
    border: 2px solid #10b981;
    box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
}

.match-player.loser {
    color: #64748b;
    background: rgba(30, 41, 59, 0.5);
    opacity: 0.7;
}

.match-vs {
    font-size: 13px;
    font-weight: 900;
    color: #f43f5e;
    padding: 6px 12px;
    background: rgba(244, 63, 94, 0.15);
    border-radius: 8px;
}

.match-score-input {
    width: 55px;
    padding: 10px;
    text-align: center;
    background: #0f172a;
    color: white;
    border: 2px solid #334155;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    outline: none;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    transition: all 0.3s;
}

.match-score-input:focus {
    border-color: #10b981;
    box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
}

.match-score-display {
    width: 55px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: #34d399;
    background: rgba(6, 78, 59, 0.9);
    padding: 8px 10px;
    border-radius: 10px;
    border: 2px solid #10b981;
    box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
}

.btn-save-match {
    background: linear-gradient(135deg, #0288d1, #01579b);
    color: white;
    border: none;
    padding: 10px 22px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    margin-right: auto;
    box-shadow: 0 4px 12px rgba(2, 136, 209, 0.3);
    transition: all 0.3s;
}

.btn-save-match:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(2, 136, 209, 0.5);
}

.btn-save-match.saved {
    background: linear-gradient(135deg, #10b981, #059669);
    cursor: default;
    box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
}

/* Podium 3D Style */
.podium-section {
    background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
    border-radius: 20px;
    padding: 30px;
    margin-top: 25px;
    box-shadow: 0 20px 50px rgba(2, 132, 199, 0.4);
    border: 1px solid rgba(255,255,255,0.2);
}

.podium-title {
    font-size: 22px;
    font-weight: 900;
    color: #facc15;
    margin-bottom: 20px;
    text-align: center;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
}

.podium-item {
    font-size: 17px;
    font-weight: bold;
    color: white;
    padding: 10px 15px;
    background: rgba(0,0,0,0.2);
    margin-bottom: 8px;
    border-radius: 10px;
}

/* Modal Styling */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(8px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
}

.modal-overlay.show { display: flex; }

.modal-box {
    background: #1e293b;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 30px;
    max-width: 500px;
    width: 90%;
    text-align: center;
    box-shadow: 0 25px 50px rgba(0,0,0,0.6);
}

.modal-box h3 { color: #f59e0b; margin-bottom: 15px; font-size: 22px; }
.modal-box p { color: #f8fafc; margin-bottom: 20px; font-size: 15px; text-align: right; line-height: 1.8; }

.modal-box .modal-btns { display: flex; gap: 12px; justify-content: center; }

.modal-box .modal-btns button {
    padding: 10px 28px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    color: white;
    transition: all 0.2s;
}

.btn-modal-yes { background: #10b981; }
.btn-modal-no { background: #ef4444; }

/* Toast Notification */
.toast {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 32px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    color: white;
    z-index: 2000;
    animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

.toast.success { background: #10b981; }
.toast.error { background: #ef4444; }
.toast.warning { background: #f59e0b; }

@keyframes toastIn { from { opacity: 0; top: -30px; } to { opacity: 1; top: 30px; } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

#celebrationCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 9999;
}

.hidden { display: none !important; }

::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: #0f172a; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #475569; }

@media (max-width: 768px) {
    #inputScreen { margin: 15px; padding: 20px; }
    .match-card { flex-direction: column; align-items: stretch; }
    .match-card .btn-save-match { margin-right: 0; margin-top: 10px; }
    .top-bar { flex-direction: column; }
    .match-player { min-width: auto; }
}
</style>
</head>
<body>

<!-- شاشة الإدخال -->
<div id="inputScreen">
    <div class="input-header">
        <div class="logo-area">
            <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="22" cy="20" rx="12" ry="18" stroke="#10b981" stroke-width="2" fill="none"/>
                <line x1="16" y1="22" x2="38" y2="46" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
                <ellipse cx="38" cy="20" rx="12" ry="18" stroke="#10b981" stroke-width="2" fill="none"/>
                <line x1="44" y1="22" x2="22" y2="46" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
                <circle cx="30" cy="28" r="4" fill="#000" stroke="#fff" stroke-width="1"/>
                <circle cx="28.5" cy="27" r="1.2" fill="#facc15"/>
                <circle cx="31.5" cy="27" r="1.2" fill="#facc15"/>
            </svg>
            <span class="author">✍️ Ahmed Essam</span>
        </div>
        <h1>🎮 نظام إدارة بطولة الإسكواش الاحترافي</h1>
        <p>إدارة المجموعات والأدوار الإقصائية وفق القواعد الدولية للعبة</p>
    </div>

    <button class="btn-import-main" onclick="importTournamentFile()">📂 استيراد ملف بطولة سابق (JSON)</button>
    <input type="file" id="fileImportInput" accept=".json" style="display:none" onchange="handleFileImport(event)">

    <div class="section-box">
        <div class="section-title">🎯 1. اختيار نظام البطولة</div>
        <div class="radio-option">

        <h3 id="modalTitle">تأكيد</h3>

<script>
let state = {
    players: [],
    parsedPlayers: [], // يحتوي الأسماء والتصنيفات
    tournamentSystem: 'knockout',
    groups: {},
    groupStats: {},
    groupMatchesData: {},
    koMatchesData: {},
    qualifiersPerGroup: 2,
    matchMode: 'Best 3',
    activeTab: 0
};

let koStagesUI = {};
let groupTabs = {};

function showToast(msg, type = 'success') {
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

function showModal(title, message, onYes) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMessage').textContent = message;
    document.getElementById('modalBtnContainer').style.display = 'flex';
    document.getElementById('modalOverlay').classList.add('show');
    document.getElementById('modalYesBtn').onclick = () => {
        document.getElementById('modalOverlay').classList.remove('show');
        if (onYes) onYes();
    };
    document.getElementById('modalNoBtn').onclick = () => {
        document.getElementById('modalOverlay').classList.remove('show');
    };
}

function showRulesModal() {
    document.getElementById('modalTitle').textContent = '📖 لائحة وقواعد لعبة الإسكواش المعتمدة';
    document.getElementById('modalMessage').innerHTML = `
        <b>1. نظام احتساب النقاط (PARS 11):</b><br>
        • يُحسب الشوط للاعب الذي يصل إلى 11 نقطة أولاً.<br>
        • عند التعادل 10-10، يلزم الفوز بفارق نقطتين متتاليتين.<br><br>
        <b>2. حسم المباريات:</b><br>
        • نظام (Best of 3): الفائز بشوطين يتأهل تلقائياً (2-0 أو 2-1).<br>
        • نظام (Best of 5): الفائز بـ 3 أشواط يتأهل تلقائياً (3-0، 3-1، 3-2).<br><br>
        <b>3. ترتيب دور المجموعات والعدالة الرياضية:</b><br>
        • يتم الترتيب حسَب: النقاط الإجمالية ⬅️ فارق الأشواط ⬅️ الأشواط المكتسبة ⬅️ المواجهات المباشرة.<br><br>
        <b>4. تكافؤ الفرص والتصنيف الدولي:</b><br>
        • يتم توزيع اللاعبين المصنفين في أطراف الشجرة المتعاكسة لمنع التضارب المبكر بين المصنفين الأوائل.
    `;
    const container = document.getElementById('modalBtnContainer');
    container.style.display = 'flex';
    container.innerHTML = `<button class="btn-modal-yes" style="background:#8b5cf6; width:100%;" onclick="closeRulesModal()">إغلاق النافذة</button>`;
    document.getElementById('modalOverlay').classList.add('show');
}

function closeRulesModal() {
    document.getElementById('modalOverlay').classList.remove('show');
    document.getElementById('modalBtnContainer').innerHTML = `
        <button class="btn-modal-yes" id="modalYesBtn">نعم</button>
        <button class="btn-modal-no" id="modalNoBtn">إلغاء</button>
    `;
}

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

document.getElementById('txtNames').addEventListener('input', updatePlayerCount);

function updatePlayerCount() {
    const rawLines = getPlayersFromTextarea();
    document.getElementById('lblCount').textContent = `📊 إجمالي المشاركين: ${rawLines.length} لاعبين`;
}

function getPlayersFromTextarea() {
    const text = document.getElementById('txtNames').value;
    return text.split('\n').map(l => l.trim()).filter(l => l);
}

/* ===== تحليلات الأسماء والتصنيفات الاستخراجية ===== */
function parsePlayersData(lines) {
    const parsed = [];
    lines.forEach(line => {
        const match = line.match(/\*(.*?)\*/);
        let seed = null;
        let cleanName = line;
        if (match) {
            seed = parseInt(match[1].trim());
            cleanName = line.replace(/\*.*?\*/, '').trim();
        }
        parsed.push({
            original: line,
            name: cleanName,
            seed: isNaN(seed) ? null : seed
        });
    });
    return parsed;
}

function toggleSystemSettings() {
    const sys = document.querySelector('input[name="sysVar"]:checked').value;
    const gof = document.getElementById('groupOptionsFrame');
    if (sys === 'knockout') {
        gof.classList.add('hidden');
    } else {
        gof.classList.remove('hidden');
    }
}

function toggleCustomGroupInput() {
    document.getElementById('entGroupSize').disabled = !document.getElementById('customGroupVar').checked;
}

function toggleCustomQualifyInput() {
    document.getElementById('entQualifyCount').disabled = !document.getElementById('customQualifyVar').checked;
}

function startTournament() {
    const lines = getPlayersFromTextarea();
    if (lines.length < 2) {
        showToast('برجاء إدخال لاعبين اثنين على الأقل!', 'error');
        return;
    }
    
    state.parsedPlayers = parsePlayersData(lines);
    state.players = state.parsedPlayers.map(p => p.name);
    state.tournamentSystem = document.querySelector('input[name="sysVar"]:checked').value;
    state.matchMode = document.querySelector('input[name="matchMode"]:checked').value;

    if (state.tournamentSystem === 'groups') {
        if (state.players.length < 4) {
            showToast('نظام المجموعات يتطلب 4 لاعبين على الأقل!', 'error');
            return;
        }
        shuffleArray(state.players);
        const customGroup = document.getElementById('customGroupVar').checked;
        if (customGroup) {
            const gSize = parseInt(document.getElementById('entGroupSize').value);
            if (isNaN(gSize) || gSize <= 1) {
                showToast('يجب أن تحتوي المجموعة على لاعبين اثنين على الأقل!', 'error');
                return;
            }
            setupCustomGroups(gSize);
        } else {
            setupGroups();
        }
        state.qualifiersPerGroup = 2;
        const customQualify = document.getElementById('customQualifyVar').checked;
        if (customQualify) {
            const qCount = parseInt(document.getElementById('entQualifyCount').value);
            if (isNaN(qCount) || qCount < 1) {
                showToast('يجب تأهل لاعب واحد على الأقل!', 'error');
                return;
            }
            state.qualifiersPerGroup = qCount;
        }
    } else {
        state.groups = {};
        state.groupStats = {};
        state.groupMatchesData = {};
        state.koMatchesData = {};
    }

    document.getElementById('inputScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    showLiveDashboard();
}

function setupCustomGroups(groupSize) {
    state.groups = {};
    const chunks = [];
    for (let i = 0; i < state.players.length; i += groupSize) {
        chunks.push(state.players.slice(i, i + groupSize));
    }
    chunks.forEach((chunk, idx) => {
        const gLetter = String.fromCharCode(65 + idx);
        state.groups[`المجموعة ${gLetter}`] = chunk;
    });
    initGroupStats();
}

function setupGroups() {
    const num = state.players.length;
    let numGroups = 1;
    if (num > 11) numGroups = 4;
    else if (num > 5) numGroups = 2;
    state.groups = {};
    for (let i = 0; i < numGroups; i++) {
        state.groups[`المجموعة ${String.fromCharCode(65 + i)}`] = [];
    }
    const gKeys = Object.keys(state.groups);
    state.players.forEach((p, idx) => {
        state.groups[gKeys[idx % numGroups]].push(p);
    });
    initGroupStats();
}

function initGroupStats() {
    state.groupStats = {};
    state.groupMatchesData = {};
    for (const [gName, pList] of Object.entries(state.groups)) {
        state.groupStats[gName] = {};
        state.groupMatchesData[gName] = [];
        pList.forEach(p => {
            state.groupStats[gName][p] = {
                played: 0, won: 0, lost: 0,
                sets_won: 0, sets_lost: 0, sets_diff: 0, points: 0
            };
        });
    }
}

function showLiveDashboard() {
    const modeTitle = state.tournamentSystem === 'groups'
        ? 'نظام المجموعات والدوري'
        : 'نظام الإقصاء المباشر (خروج المغلوب)';
    document.getElementById('modeTitle').textContent = `لوحة تحكم البطولة الحية (${modeTitle})`;

    const tabsContainer = document.getElementById('tabsContainer');
    const tabsContent = document.getElementById('tabsContent');
    tabsContainer.innerHTML = '';
    tabsContent.innerHTML = '';

    if (state.tournamentSystem === 'groups') {
        const gKeys = Object.keys(state.groups);
        gKeys.forEach((gName, idx) => {
            const tabBtn = document.createElement('button');
            tabBtn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
            tabBtn.textContent = `  ${gName}  `;
            tabBtn.onclick = () => switchTab(idx);
            tabsContainer.appendChild(tabBtn);

            const tabDiv = document.createElement('div');
            tabDiv.className = 'tab-content' + (idx === 0 ? ' active' : '');
            tabDiv.id = `tabGroup_${gName}`;
            tabsContent.appendChild(tabDiv);

            groupTabs[gName] = tabDiv;
            buildSingleGroupUI(gName, tabDiv);
        });

        const koIdx = gKeys.length;
        const koBtn = document.createElement('button');
        koBtn.className = 'tab-btn';
        koBtn.textContent = '  👑 الأدوار الإقصائية والتتويج  ';
        koBtn.onclick = () => switchTab(koIdx);
        tabsContainer.appendChild(koBtn);

        const koDiv = document.createElement('div');
        koDiv.className = 'tab-content';
        koDiv.id = 'tabKnockout';
        tabsContent.appendChild(koDiv);
        initKnockoutStructure(koDiv);
    } else {
        const koBtn = document.createElement('button');
        koBtn.className = 'tab-btn active';
        koBtn.textContent = '  ⚔️ شجرة البطولة والمواجهات  ';
        koBtn.onclick = () => switchTab(0);
        tabsContainer.appendChild(koBtn);

        const koDiv = document.createElement('div');
        koDiv.className = 'tab-content active';
        koDiv.id = 'tabKnockout';
        tabsContent.appendChild(koDiv);
        initKnockoutStructure(koDiv);
    }
}

function switchTab(idx) {
    const btns = document.querySelectorAll('.tab-btn');
    const contents = document.querySelectorAll('.tab-content');
    btns.forEach((b, i) => b.classList.toggle('active', i === idx));
    contents.forEach((c, i) => c.classList.toggle('active', i === idx));
    state.activeTab = idx;
}

function buildSingleGroupUI(gName, parentTab) {
    parentTab.innerHTML = '';

    const ctrlCard = document.createElement('div');
    ctrlCard.className = 'group-controls';
    ctrlCard.innerHTML = `<div class="ctrl-title">⚙️ إدارة وسحب/نقل اللاعبين</div>`;

    const row1 = document.createElement('div');
    row1.className = 'ctrl-row';
    row1.innerHTML = `
        <label>إضافة لاعب:</label>
        <input type="text" id="entNew_${gName}" placeholder="اسم اللاعب">
        <button class="btn-add" onclick="addPlayerToGroup('${gName}')">➕ إضافة</button>
        <label style="margin-right:15px">إزالة لاعب:</label>
        <select id="cboRemove_${gName}"></select>
        <button class="btn-remove" onclick="removePlayerFromGroup('${gName}')">❌ إزالة</button>
    `;
    ctrlCard.appendChild(row1);

    const row2 = document.createElement('div');
    row2.className = 'ctrl-row';
    const otherGroups = Object.keys(state.groups).filter(g => g !== gName);
    row2.innerHTML = `
        <label style="color:#f59e0b">🔁 نقل لاعب:</label>
        <select id="cboP_${gName}"></select>
        <label>إلى:</label>
        <select id="cboTarget_${gName}">${otherGroups.map(g => `<option value="${g}">${g}</option>`).join('')}</select>
        <button class="btn-transfer" onclick="transferPlayer('${gName}')">🚀 نقل الآن</button>
    `;
    ctrlCard.appendChild(row2);
    parentTab.appendChild(ctrlCard);

    const tableSection = document.createElement('div');
    tableSection.className = 'table-section';
    const gLetter = gName.replace('المجموعة ', '').trim();
    tableSection.innerHTML = `
        <div class="table-title">ترتيب المجموعة ${gLetter} (نظام ${state.matchMode})</div>
        <table class="standings-table" id="table_${gName}">
            <thead>
                <tr>
                    <th>#</th><th>اللاعب</th><th>لعب</th><th>فوز</th><th>خسارة</th>
                    <th>أشواط له</th><th>أشواط عليه</th><th>الفارق</th><th>النقاط</th>
                </tr>
            </thead>
            <tbody id="tbody_${gName}"></tbody>
        </table>
    `;
    parentTab.appendChild(tableSection);

    const matchesSection = document.createElement('div');
    matchesSection.className = 'matches-section';
    matchesSection.innerHTML = `<div class="matches-title">📋 مباريات المجموعة</div>`;
    const matchesDiv = document.createElement('div');
    matchesDiv.id = `matches_${gName}`;
    matchesSection.appendChild(matchesDiv);
    parentTab.appendChild(matchesSection);

    updateGroupTable(gName);
    renderGroupMatches(gName);
    populateGroupSelects(gName);
}

function populateGroupSelects(gName) {
    const players = state.groups[gName] || [];
    const cboRemove = document.getElementById(`cboRemove_${gName}`);
    const cboP = document.getElementById(`cboP_${gName}`);
    if (cboRemove) cboRemove.innerHTML = players.map(p => `<option value="${p}">${p}</option>`).join('');
    if (cboP) cboP.innerHTML = players.map(p => `<option value="${p}">${p}</option>`).join('');
}

function updateGroupTable(gName) {
    const tbody = document.getElementById(`tbody_${gName}`);
    if (!tbody) return;
    tbody.innerHTML = '';
    const stats = state.groupStats[gName] || {};
    const matches = state.groupMatchesData[gName] || [];

    const sorted = Object.entries(stats).sort((a, b) => {
        if (b[1].points !== a[1].points) return b[1].points - a[1].points;
        if (b[1].sets_diff !== a[1].sets_diff) return b[1].sets_diff - a[1].sets_diff;
        if (b[1].sets_won !== a[1].sets_won) return b[1].sets_won - a[1].sets_won;
        const direct = matches.find(m => (m.p1 === a[0] && m.p2 === b[0]) || (m.p1 === b[0] && m.p2 === a[0]));
        if (direct) return direct.winner === a[0] ? -1 : 1;
        
        return b[1].won - a[1].won;
    });

    sorted.forEach(([pName, pInfo], idx) => {
        const pos = idx + 1;
        const isQualified = pos <= state.qualifiersPerGroup;
        const diffStr = pInfo.sets_diff >= 0 ? `+${pInfo.sets_diff}` : `${pInfo.sets_diff}`;
        const tr = document.createElement('tr');
        tr.className = isQualified ? 'qualified' : 'normal_row';
        tr.innerHTML = `
            <td>${pos}</td><td>${pName}</td><td>${pInfo.played}</td>
            <td>${pInfo.won}</td><td>${pInfo.lost}</td>
            <td>${pInfo.sets_won}</td><td>${pInfo.sets_lost}</td>
            <td>${diffStr}</td><td>${pInfo.points}</td>
        `;
        tbody.appendChild(tr);
    });
}

function renderGroupMatches(gName) {
    const matchesDiv = document.getElementById(`matches_${gName}`);
    if (!matchesDiv) return;
    matchesDiv.innerHTML = '';
    const pList = state.groups[gName] || [];
    let matchIdx = 0;
    for (let i = 0; i < pList.length; i++) {
        for (let j = i + 1; j < pList.length; j++) {
            matchIdx++;
            const p1 = pList[i], p2 = pList[j];
            const saved = (state.groupMatchesData[gName] || []).find(m => (m.p1 === p1 && m.p2 === p2) || (m.p1 === p2 && m.p2 === p1));
            const isSaved = !!saved;

            const card = document.createElement('div');
            card.className = 'match-card' + (isSaved ? ' completed' : '');

            if (isSaved) {
                const p1IsWinner = saved.winner === p1;
                const p2IsWinner = saved.winner === p2;
                card.innerHTML = `
                    <div class="match-number">مباراة ${matchIdx}</div>
                    <div class="match-player ${p1IsWinner ? 'winner' : 'loser'}">${p1}</div>
                    <div class="match-score-display">${saved.p1 === p1 ? saved.s1 : saved.s2}</div>
                    <div class="match-vs">VS</div>
                    <div class="match-score-display">${saved.p1 === p1 ? saved.s2 : saved.s1}</div>
                    <div class="match-player ${p2IsWinner ? 'winner' : 'loser'}">${p2}</div>
                    <button class="btn-save-match saved" disabled>✔ الفائز: ${saved.winner}</button>
                `;
            } else {
                card.innerHTML = `
                    <div class="match-number">مباراة ${matchIdx}</div>
                    <div class="match-player">${p1}</div>
                    <input type="number" min="0" max="5" class="match-score-input" id="ment1_${gName}_${matchIdx}" placeholder="0">
                    <div class="match-vs">VS</div>
                    <input type="number" min="0" max="5" class="match-score-input" id="ment2_${gName}_${matchIdx}" placeholder="0">
                    <div class="match-player">${p2}</div>
                    <button class="btn-save-match" onclick="saveGroupMatch('${gName}', '${p1}', '${p2}', ${matchIdx})">
                        💾 حفظ النتيجة
                    </button>
                `;
            }
            matchesDiv.appendChild(card);
        }
    }
}

function saveGroupMatch(gName, p1, p2, matchIdx) {
    const e1 = document.getElementById(`ment1_${gName}_${matchIdx}`);
    const e2 = document.getElementById(`ment2_${gName}_${matchIdx}`);
    const s1 = parseInt(e1.value);
    const s2 = parseInt(e2.value);
    if (isNaN(s1) || isNaN(s2)) {
        showToast('برجاء إدخال أرقام صحيحة للأشواط!', 'warning');
        return;
    }
    if (state.matchMode === 'Best 3') {
        if (Math.max(s1, s2) !== 2 || Math.min(s1, s2) > 1 || s1 === s2) {
            showToast('في نظام Best of 3، يجب أن تنتهي المباراة بـ (2-0) أو (2-1)!', 'error');
            return;
        }
    } else {
        if (Math.max(s1, s2) !== 3 || Math.min(s1, s2) > 2 || s1 === s2) {
            showToast('في نظام Best of 5، يجب أن تنتهي المباراة بـ (3-0) أو (3-1) أو (3-2)!', 'error');
            return;
        }
    }
    const winner = s1 > s2 ? p1 : p2;
    const loser = s1 > s2 ? p2 : p1;

    state.groupStats[gName][p1].played++;
    state.groupStats[gName][p2].played++;
    state.groupStats[gName][winner].won++;
    state.groupStats[gName][loser].lost++;
    state.groupStats[gName][p1].sets_won += s1;
    state.groupStats[gName][p1].sets_lost += s2;
    state.groupStats[gName][p1].sets_diff = state.groupStats[gName][p1].sets_won - state.groupStats[gName][p1].sets_lost;
    state.groupStats[gName][p2].sets_won += s2;
    state.groupStats[gName][p2].sets_lost += s1;
    state.groupStats[gName][p2].sets_diff = state.groupStats[gName][p2].sets_won - state.groupStats[gName][p2].sets_lost;
    state.groupStats[gName][winner].points += 3;

    if (!state.groupMatchesData[gName]) state.groupMatchesData[gName] = [];
    state.groupMatchesData[gName].push({ p1, p2, s1, s2, winner });

    renderGroupMatches(gName);
    updateGroupTable(gName);
    initKnockoutStructure(document.getElementById('tabKnockout'));
}

function addPlayerToGroup(gName) {
    const ent = document.getElementById(`entNew_${gName}`);
    const newName = ent.value.trim();
    if (!newName) { showToast('برجاء كتابة اسم اللاعب أولاً!', 'warning'); return; }
    if (state.groupStats[gName][newName]) { showToast('هذا اللاعب موجود بالفعل!', 'warning'); return; }
    state.groups[gName].push(newName);
    state.groupStats[gName][newName] = { played: 0, won: 0, lost: 0, sets_won: 0, sets_lost: 0, sets_diff: 0, points: 0 };
    ent.value = '';
    reloadGroupUI(gName);
}

function removePlayerFromGroup(gName) {
    const cbo = document.getElementById(`cboRemove_${gName}`);
    const pToRemove = cbo.value;
    if (!pToRemove) { showToast('برجاء اختيار لاعب!', 'warning'); return; }
    showModal('تأكيد الإزالة', `هل تريد إزالة (${pToRemove}) من ${gName}؟`, () => {
        state.groups[gName] = state.groups[gName].filter(p => p !== pToRemove);
        delete state.groupStats[gName][pToRemove];
        reloadGroupUI(gName);
    });
}

function transferPlayer(sourceG) {
    const cboP = document.getElementById(`cboP_${sourceG}`);
    const cboTarget = document.getElementById(`cboTarget_${sourceG}`);
    const player = cboP.value;
    const targetG = cboTarget.value;
    if (!player || !targetG) { showToast('برجاء الاختيار!', 'warning'); return; }
    if (state.groups[targetG].includes(player)) { showToast('اللاعب موجود بالفعل!', 'warning'); return; }
    showModal('تأكيد النقل', `نقل (${player}) من ${sourceG} إلى ${targetG}؟`, () => {
        state.groups[sourceG] = state.groups[sourceG].filter(p => p !== player);
        delete state.groupStats[sourceG][player];
        state.groups[targetG].push(player);
        state.groupStats[targetG][player] = { played: 0, won: 0, lost: 0, sets_won: 0, sets_lost: 0, sets_diff: 0, points: 0 };
        reloadGroupUI(sourceG);
        reloadGroupUI(targetG);
    });
}

function reloadGroupUI(gName) {
    const tabDiv = groupTabs[gName];
    if (tabDiv) buildSingleGroupUI(gName, tabDiv);
    const koTab = document.getElementById('tabKnockout');
    if (koTab) initKnockoutStructure(koTab);
}

/* ===== خوارزمية تكافؤ الفرص والعدالة لترتيب المتأهلين من المجموعات ===== */
function getAllQualifiers() {
    if (state.tournamentSystem === 'knockout') return [...state.players];

    const groupQualifiers = {};
    const gKeys = Object.keys(state.groupStats).sort();

    gKeys.forEach(gName => {
        const stats = state.groupStats[gName];
        const matches = state.groupMatchesData[gName] || [];
        const sorted = Object.entries(stats).sort((a, b) => {
            if (b[1].points !== a[1].points) return b[1].points - a[1].points;
            if (b[1].sets_diff !== a[1].sets_diff) return b[1].sets_diff - a[1].sets_diff;
            if (b[1].sets_won !== a[1].sets_won) return b[1].sets_won - a[1].sets_won;
            const direct = matches.find(m => (m.p1 === a[0] && m.p2 === b[0]) || (m.p1 === b[0] && m.p2 === a[0]));
            if (direct) return direct.winner === a[0] ? -1 : 1;
            return b[1].won - a[1].won;
        });

        const qList = [];
        for (let i = 0; i < state.qualifiersPerGroup; i++) {
            if (sorted[i]) {
                qList.push(`${sorted[i][0]} (${gName})`);
            } else {
                qList.push(`المركز ${i + 1} ${gName}`);
            }
        }
        groupQualifiers[gName] = qList;
    });

    const nGroups = gKeys.length;
    const qualifiers = [];

    // التناظر التقاطعي المتكافئ (Cross-Pairing System) لضمان مقابلة الأول للآخر
    if (nGroups >= 2) {
        const K = state.qualifiersPerGroup;
        const totalMatches = Math.ceil((nGroups * K) / 2);
        
        for (let m = 0; m < totalMatches; m++) {
            const gTopIdx = m % nGroups;
            const rTopIdx = Math.floor(m / nGroups);
            
            const gBotIdx = (nGroups - 1 - gTopIdx + Math.floor(m / nGroups)) % nGroups;
            const rBotIdx = K - 1 - rTopIdx;
            
            const p1 = (groupQualifiers[gKeys[gTopIdx]] && groupQualifiers[gKeys[gTopIdx]][rTopIdx]) 
                ? groupQualifiers[gKeys[gTopIdx]][rTopIdx] 
                : `شاغر`;
            const p2 = (groupQualifiers[gKeys[gBotIdx]] && groupQualifiers[gKeys[gBotIdx]][rBotIdx]) 
                ? groupQualifiers[gKeys[gBotIdx]][rBotIdx] 
                : `شاغر`;
                
            qualifiers.push(p1);
            qualifiers.push(p2);
        }
    } else {
        gKeys.forEach(g => qualifiers.push(...groupQualifiers[g]));
    }
    return qualifiers;
}

/* ===== خوارزمية القرعة وتوزيع المصنفين دولياً في الإقصاء المباشر ===== */
function generateSeededBracket(parsedPlayers, targetSize) {
    const bracket = new Array(targetSize).fill(null);
    
    // فصل المصنفين وغير المصنفين
    const seeded = parsedPlayers.filter(p => p.seed !== null).sort((a, b) => a.seed - b.seed);
    const unseeded = parsedPlayers.filter(p => p.seed === null);
    shuffleArray(unseeded);

    // دالة إنشاء المواضع الهيكلية بالترتيب الدولي
    function getStandardSeedPositions(size) {
        if (size === 1) return [0];
        if (size === 2) return [0, 1];
        let positions = [0, 1];
        while (positions.length < size) {
            const nextPositions = [];
            const curLen = positions.length * 2;
            for (let i = 0; i < positions.length; i++) {
                nextPositions.push(positions[i]);
                nextPositions.push(curLen - 1 - positions[i]);
            }
            positions = nextPositions;
        }
        return positions;
    }

    const seedPositions = getStandardSeedPositions(targetSize);

    // توزيع المصنفين
    seeded.forEach((player, idx) => {
        if (idx < targetSize) {
            const pos = seedPositions[idx];
            bracket[pos] = `${player.name} [مصنف ${player.seed}]`;
        } else {
            unseeded.push(player);
        }
    });

    // ملء المواضع المتبقية بالغير مصنفين ثم الـ Bye
    for (let i = 0; i < targetSize; i++) {
        if (bracket[i] === null) {
            if (unseeded.length > 0) {
                const nextUnseeded = unseeded.shift();
                bracket[i] = nextUnseeded.name;
            } else {
                bracket[i] = 'Bye (تأهل تلقائي)';
            }
        }
    }

    return bracket;
}

/* ===== تحسين الشجرة الإقصائية وحساب أقرب قوة للعدد 2 ===== */
function initKnockoutStructure(koTab) {
    if (!koTab) koTab = document.getElementById('tabKnockout');
    if (!koTab) return;
    koTab.innerHTML = '';
    koStagesUI = {};

    let qualifiers = [];
    if (state.tournamentSystem === 'knockout') {
        const rawLines = getPlayersFromTextarea();
        state.parsedPlayers = parsePlayersData(rawLines);
        const totalQ = state.parsedPlayers.length;

        if (totalQ < 2) {
            koTab.innerHTML = '<p style="text-align:center;color:#94a3b8;font-size:18px;margin:40px 0;">برجاء إدخال لاعبين اثنين على الأقل...</p>';
            return;
        }

        let targetSize = 2;
        while (targetSize < totalQ) {
            targetSize *= 2;
        }

        qualifiers = generateSeededBracket(state.parsedPlayers, targetSize);
    } else {
        const rawQualifiers = getAllQualifiers();
        const totalQ = rawQualifiers.length;

        if (totalQ < 2) {
            koTab.innerHTML = '<p style="text-align:center;color:#94a3b8;font-size:18px;margin:40px 0;">بانتظار اكتمال المتأهلين...</p>';
            return;
        }

        let targetSize = 2;
        while (targetSize < totalQ) {
            targetSize *= 2;
        }

        qualifiers = [...rawQualifiers];
        while (qualifiers.length < targetSize) {
            qualifiers.push('Bye (تأهل تلقائي)');
        }
    }

    const targetSize = qualifiers.length;
    const h2 = document.createElement('h2');
    h2.style.cssText = 'text-align:center;color:#f8fafc;font-size:22px;margin:20px 0;';
    h2.textContent = state.tournamentSystem === 'knockout'
        ? `مواجهات خروج المغلوب الإقصائية (${state.parsedPlayers.length} لاعباً متنافساً)`
        : `الشجرة الإقصائية (${qualifiers.length} لاعبين متأهلين)`;
    koTab.appendChild(h2);

    let stagesOrder = [];
    if (targetSize === 256) stagesOrder = ["دور الـ 256", "دور الـ 128", "دور الـ 64", "دور الـ 32", "دور الـ 16", "دور الـ 8 (الربع النهائي)", "دور الـ 4 (النصف النهائي)"];
    else if (targetSize === 128) stagesOrder = ["دور الـ 128", "دور الـ 64", "دور الـ 32", "دور الـ 16", "دور الـ 8 (الربع النهائي)", "دور الـ 4 (النصف النهائي)"];
    else if (targetSize === 64) stagesOrder = ["دور الـ 64", "دور الـ 32", "دور الـ 16", "دور الـ 8 (الربع النهائي)", "دور الـ 4 (النصف النهائي)"];
    else if (targetSize === 32) stagesOrder = ["دور الـ 32", "دور الـ 16", "دور الـ 8 (الربع النهائي)", "دور الـ 4 (النصف النهائي)"];
    else if (targetSize === 16) stagesOrder = ["دور الـ 16", "دور الـ 8 (الربع النهائي)", "دور الـ 4 (النصف النهائي)"];
    else if (targetSize === 8) stagesOrder = ["دور الـ 8 (الربع النهائي)", "دور الـ 4 (النصف النهائي)"];
    else stagesOrder = ["دور الـ 4 (النصف النهائي)"];

    let prevWinners = qualifiers;
    stagesOrder.forEach((stageName, sIdx) => {
        let numMatches = Math.floor(targetSize / Math.pow(2, sIdx + 1));
        if (numMatches < 1) numMatches = 1;

        const stageDiv = document.createElement('div');
        stageDiv.className = 'matches-section';
        stageDiv.innerHTML = `<div class="matches-title">⚔️ ${stageName}</div>`;
        koStagesUI[stageName] = [];

        for (let mI = 0; mI < numMatches; mI++) {
            let p1, p2;
            if (sIdx === 0) {
                p1 = prevWinners[mI * 2] || 'Bye (تأهل تلقائي)';
                p2 = prevWinners[mI * 2 + 1] || 'Bye (تأهل تلقائي)';
            } else {
                p1 = 'بانتظار الفائز...';
                p2 = 'بانتظار الفائز...';
            }
            const isRound1 = sIdx === 0;
            const row = renderKOMatchCard(stageDiv, `مباراة ${mI + 1}`, p1, p2, isRound1, stageName, mI);
            koStagesUI[stageName].push(row);
        }
        koTab.appendChild(stageDiv);
    });

    const thirdDiv = document.createElement('div');
    thirdDiv.className = 'matches-section';
    thirdDiv.innerHTML = `<div class="matches-title">مباراة تحديد المركز الثالث والرابع</div>`;
    renderKOMatchCard(thirdDiv, 'المركز 3-4', 'خاسر نصف النهائي 1', 'خاسر نصف النهائي 2', false, 'third', 0);
    koTab.appendChild(thirdDiv);

    const finalDiv = document.createElement('div');
    finalDiv.className = 'matches-section';
    finalDiv.innerHTML = `<div class="matches-title" style="color:#10b981">🏆 المباراة النهائية</div>`;
    renderKOMatchCard(finalDiv, 'النهائي', 'فائز نصف النهائي 1', 'فائز نصف النهائي 2', false, 'final', 0);
    koTab.appendChild(finalDiv);

    const podiumDiv = document.createElement('div');
    podiumDiv.className = 'podium-section';
    podiumDiv.innerHTML = `
        <div class="podium-title">👑 منصة التتويج والجوائز 👑</div>
        <div class="podium-item" id="podium1st">🥇 المركز الأول (البطل): ---</div>
        <div class="podium-item">🥈 المركز الثاني (الوصيف): ---</div>
        <div class="podium-item">🥉 المركز الثالث: ---</div>
        <div class="podium-item">🎖 المركز الرابع: ---</div>
    `;
    koTab.appendChild(podiumDiv);

    handleAutomaticByes(stagesOrder[0]);
    restoreSavedKOMatches();
}

function handleAutomaticByes(firstStageName) {
    if (!koStagesUI[firstStageName]) return;
    koStagesUI[firstStageName].forEach((m, mI) => {
        const uid = `ko_${firstStageName}_${mI}`;
        const lbl1 = document.getElementById(`koLbl1_${uid}`);
        const lbl2 = document.getElementById(`koLbl2_${uid}`);
        if (!lbl1 || !lbl2) return;

        const p1 = lbl1.textContent.trim();
        const p2 = lbl2.textContent.trim();

        if (p1 === 'Bye (تأهل تلقائي)' && p2 !== 'Bye (تأهل تلقائي)' && !p2.includes('بانتظار')) {
            autoAdvanceKO(firstStageName, mI, p2, p1);
        } else if (p2 === 'Bye (تأهل تلقائي)' && p1 !== 'Bye (تأهل تلقائي)' && !p1.includes('بانتظار')) {
            autoAdvanceKO(firstStageName, mI, p1, p2);
        }
    });
}

function autoAdvanceKO(stageName, matchIdx, winner, loser) {
    const uid = `ko_${stageName}_${matchIdx}`;
    const lbl1 = document.getElementById(`koLbl1_${uid}`);
    const lbl2 = document.getElementById(`koLbl2_${uid}`);
    const ent1 = document.getElementById(`koEnt1_${uid}`);
    const ent2 = document.getElementById(`koEnt2_${uid}`);
    const btn = document.getElementById(`koBtn_${uid}`);
    const card = btn ? btn.closest('.match-card') : null;

    if (card) card.className = 'match-card completed';
    if (lbl1) lbl1.className = 'match-player' + (lbl1.textContent.trim() === winner ? ' winner' : ' loser');
    if (lbl2) lbl2.className = 'match-player' + (lbl2.textContent.trim() === winner ? ' winner' : ' loser');

    if (ent1) ent1.style.display = 'none';
    if (ent2) ent2.style.display = 'none';

    if (btn) {
        btn.textContent = `✔ تأهل تلقائي: ${winner}`;
        btn.className = 'btn-save-match saved';
        btn.disabled = true;
    }

    const matchKey = `${stageName}_${matchIdx}`;
    state.koMatchesData[matchKey] = { stage: stageName, idx: matchIdx, p1: lbl1 ? lbl1.textContent.trim() : winner, p2: lbl2 ? lbl2.textContent.trim() : loser, s1: 0, s2: 0, winner, loser };

    if (koStagesUI[stageName]) {
        koStagesUI[stageName][matchIdx].winner = winner;
        koStagesUI[stageName][matchIdx].loser = loser;
        advanceWinnerInstantly(stageName, matchIdx, winner, loser);
    }
}

function renderKOMatchCard(parent, mTitle, p1, p2, enabled, stageName, matchIdx) {
    const card = document.createElement('div');
    card.className = 'match-card';
    const uid = `ko_${stageName}_${matchIdx}`;

    card.innerHTML = `
        <div class="match-number">${mTitle}</div>
        <div class="match-player" id="koLbl1_${uid}">${p1}</div>
        <input type="number" min="0" max="5" class="match-score-input" id="koEnt1_${uid}" ${enabled ? '' : 'disabled'} placeholder="0">
        <div class="match-vs">VS</div>
        <input type="number" min="0" max="5" class="match-score-input" id="koEnt2_${uid}" ${enabled ? '' : 'disabled'} placeholder="0">
        <div class="match-player" id="koLbl2_${uid}">${p2}</div>
        <button class="btn-save-match" id="koBtn_${uid}" ${enabled ? '' : 'disabled'}
            onclick="processKOSave('${stageName}', ${matchIdx})">
            💾 حفظ النتيجة
        </button>
    `;
    parent.appendChild(card);
    return { lbl1Id: `koLbl1_${uid}`, lbl2Id: `koLbl2_${uid}`, ent1Id: `koEnt1_${uid}`, ent2Id: `koEnt2_${uid}`, btnId: `koBtn_${uid}`, winner: null, loser: null, stageName, matchIdx };
}

function processKOSave(stageName, matchIdx) {
    const uid = `ko_${stageName}_${matchIdx}`;
    const lbl1 = document.getElementById(`koLbl1_${uid}`);
    const lbl2 = document.getElementById(`koLbl2_${uid}`);
    const ent1 = document.getElementById(`koEnt1_${uid}`);
    const ent2 = document.getElementById(`koEnt2_${uid}`);
    const btn = document.getElementById(`koBtn_${uid}`);
    const card = btn.closest('.match-card');

    const p1 = lbl1.textContent.trim();
    const p2 = lbl2.textContent.trim();
    if (p1.includes('بانتظار') || p2.includes('بانتظار')) {
        showToast('المباراة لم تكتمل!', 'warning');
        return;
    }
    const s1 = parseInt(ent1.value);
    const s2 = parseInt(ent2.value);
    if (isNaN(s1) || isNaN(s2)) {
        showToast('برجاء إدخال أرقام صحيحة!', 'warning');
        return;
    }
    if (state.matchMode === 'Best 3') {
        if (Math.max(s1, s2) !== 2 || Math.min(s1, s2) > 1 || s1 === s2) {
            showToast('في نظام Best of 3، يجب (2-0) أو (2-1)!', 'error');
            return;
        }
    } else {
        if (Math.max(s1, s2) !== 3 || Math.min(s1, s2) > 2 || s1 === s2) {
            showToast('في نظام Best of 5، يجب (3-0) أو (3-1) أو (3-2)!', 'error');
            return;
        }
    }
    const winner = s1 > s2 ? p1 : p2;
    const loser = s1 > s2 ? p2 : p1;

    card.className = 'match-card completed';
    lbl1.className = 'match-player' + (s1 > s2 ? ' winner' : ' loser');
    lbl2.className = 'match-player' + (s2 > s1 ? ' winner' : ' loser');

    ent1.style.display = 'none';
    ent2.style.display = 'none';

    const sd1 = document.createElement('div');
    sd1.className = 'match-score-display';
    sd1.textContent = s1;
    ent1.parentNode.insertBefore(sd1, ent1.nextSibling);

    const sd2 = document.createElement('div');
    sd2.className = 'match-score-display';
    sd2.textContent = s2;
    ent2.parentNode.insertBefore(sd2, ent2.nextSibling);

    btn.textContent = `✔ الفائز: ${winner}`;
    btn.className = 'btn-save-match saved';
    btn.disabled = true;

    const matchKey = `${stageName}_${matchIdx}`;
    state.koMatchesData[matchKey] = { stage: stageName, idx: matchIdx, p1, p2, s1, s2, winner, loser };

    if (koStagesUI[stageName]) {
        koStagesUI[stageName][matchIdx].winner = winner;
        koStagesUI[stageName][matchIdx].loser = loser;
        advanceWinnerInstantly(stageName, matchIdx, winner, loser);
    } else if (stageName === 'third') {
        const podiumItems = document.querySelectorAll('.podium-item');
        if (podiumItems[2]) podiumItems[2].textContent = `🥉 المركز الثالث: ${winner}`;
        if (podiumItems[3]) podiumItems[3].textContent = `🎖️ المركز الرابع: ${loser}`;
    } else if (stageName === 'final') {
        const podiumItems = document.querySelectorAll('.podium-item');
        if (podiumItems[0]) podiumItems[0].textContent = `🥇 المركز الأول (البطل): 👑 ${winner} 👑`;
        if (podiumItems[1]) podiumItems[1].textContent = `🥈 المركز الثاني (الوصيف): ${loser}`;
        triggerCelebration();
    }
}

function advanceWinnerInstantly(currentStageName, matchIdx, winner, loser) {
    const stagesKeys = Object.keys(koStagesUI);
    const currIdx = stagesKeys.indexOf(currentStageName);

    if (currIdx + 1 < stagesKeys.length) {
        const nextStageName = stagesKeys[currIdx + 1];
        const targetMatchIdx = Math.floor(matchIdx / 2);
        const isFirstSlot = (matchIdx % 2 === 0);

        const targetUid = `ko_${nextStageName}_${targetMatchIdx}`;
        const targetLbl = document.getElementById(isFirstSlot ? `koLbl1_${targetUid}` : `koLbl2_${targetUid}`);

        if (targetLbl) {
            targetLbl.textContent = winner;
        }

        const lbl1 = document.getElementById(`koLbl1_${targetUid}`).textContent.trim();
        const lbl2 = document.getElementById(`koLbl2_${targetUid}`).textContent.trim();
        if (!lbl1.includes('بانتظار') && !lbl2.includes('بانتظار')) {
            document.getElementById(`koEnt1_${targetUid}`).disabled = false;
            document.getElementById(`koEnt2_${targetUid}`).disabled = false;
            document.getElementById(`koBtn_${targetUid}`).disabled = false;
            
            if (lbl1 === 'Bye (تأهل تلقائي)' && lbl2 !== 'Bye (تأهل تلقائي)') {
                autoAdvanceKO(nextStageName, targetMatchIdx, lbl2, lbl1);
            } else if (lbl2 === 'Bye (تأهل تلقائي)' && lbl1 !== 'Bye (تأهل تلقائي)') {
                autoAdvanceKO(nextStageName, targetMatchIdx, lbl1, lbl2);
            }
        }
    } else if (currentStageName.includes('النصف النهائي') || currentStageName === 'دور الـ 4 (النصف النهائي)') {
        const thirdUid = 'ko_third_0';
        const finalUid = 'ko_final_0';
        const isFirstSemi = (matchIdx === 0);

        const thirdLbl = document.getElementById(isFirstSemi ? `koLbl1_${thirdUid}` : `koLbl2_${thirdUid}`);
        const finalLbl = document.getElementById(isFirstSemi ? `koLbl1_${finalUid}` : `koLbl2_${finalUid}`);

        if (thirdLbl) thirdLbl.textContent = loser;
        if (finalLbl) finalLbl.textContent = winner;

        const t1 = document.getElementById(`koLbl1_${thirdUid}`).textContent.trim();
        const t2 = document.getElementById(`koLbl2_${thirdUid}`).textContent.trim();
        if (!t1.includes('خاسر') && !t2.includes('خاسر')) {
            document.getElementById(`koEnt1_${thirdUid}`).disabled = false;
            document.getElementById(`koEnt2_${thirdUid}`).disabled = false;
            document.getElementById(`koBtn_${thirdUid}`).disabled = false;
        }

        const f1 = document.getElementById(`koLbl1_${finalUid}`).textContent.trim();
        const f2 = document.getElementById(`koLbl2_${finalUid}`).textContent.trim();
        if (!f1.includes('فائز') && !f2.includes('فائز')) {
            document.getElementById(`koEnt1_${finalUid}`).disabled = false;
            document.getElementById(`koEnt2_${finalUid}`).disabled = false;
            document.getElementById(`koBtn_${finalUid}`).disabled = false;
        }
    }
}

function restoreSavedKOMatches() {
    if (!Object.keys(state.koMatchesData).length) return;
    for (const [matchKey, data] of Object.entries(state.koMatchesData)) {
        const { stage, idx, p1, p2, s1, s2, winner, loser } = data;
        const uid = `ko_${stage}_${idx}`;
        const lbl1 = document.getElementById(`koLbl1_${uid}`);
        const lbl2 = document.getElementById(`koLbl2_${uid}`);
        const ent1 = document.getElementById(`koEnt1_${uid}`);
        const ent2 = document.getElementById(`koEnt2_${uid}`);
        const btn = document.getElementById(`koBtn_${uid}`);
        if (!lbl1) continue;
        const card = btn.closest('.match-card');

        lbl1.textContent = p1;
        lbl2.textContent = p2;
        lbl1.className = 'match-player' + (winner === p1 ? ' winner' : ' loser');
        lbl2.className = 'match-player' + (winner === p2 ? ' winner' : ' loser');

        if (card) card.className = 'match-card completed';

        ent1.style.display = 'none';
        ent2.style.display = 'none';

        const sd1 = document.createElement('div');
        sd1.className = 'match-score-display';
        sd1.textContent = s1;
        ent1.parentNode.insertBefore(sd1, ent1.nextSibling);

        const sd2 = document.createElement('div');
        sd2.className = 'match-score-display';
        sd2.textContent = s2;
        ent2.parentNode.insertBefore(sd2, ent2.nextSibling);

        btn.textContent = `✔ الفائز: ${winner}`;
        btn.className = 'btn-save-match saved';
        btn.disabled = true;

        if (koStagesUI[stage] && idx < koStagesUI[stage].length) {
            koStagesUI[stage][idx].winner = winner;
            koStagesUI[stage][idx].loser = loser;
            advanceWinnerInstantly(stage, idx, winner, loser);
        } else if (stage === 'third') {
            const podiumItems = document.querySelectorAll('.podium-item');
            if (podiumItems[2]) podiumItems[2].textContent = `🥉 المركز الثالث: ${winner}`;
            if (podiumItems[3]) podiumItems[3].textContent = `🎖 المركز الرابع: ${loser}`;
        } else if (stage === 'final') {
            const podiumItems = document.querySelectorAll('.podium-item');
            if (podiumItems[0]) podiumItems[0].textContent = `🥇 المركز الأول (البطل): 👑 ${winner} 👑`;
            if (podiumItems[1]) podiumItems[1].textContent = `🥈 المركز الثاني (الوصيف): ${loser}`;
        }
    }
}

function exportTournamentFile() {
    const data = {
        tournament_system: state.tournamentSystem,
        players: state.players,
        parsed_players: state.parsedPlayers,
        groups: state.groups,
        group_stats: state.groupStats,
        group_matches_data: state.groupMatchesData,
        ko_matches_data: state.koMatchesData,
        qualifiers_per_group: state.qualifiersPerGroup,
        match_mode: state.matchMode
    };
    const blob = new Blob([JSON.stringify(data, null, 4)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'tournament_data.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('تم حفظ البطولة بنجاح!');
}

function importTournamentFile() {
    document.getElementById('fileImportInput').click();
}

function handleFileImport(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            state.tournamentSystem = data.tournament_system || 'knockout';
            state.players = data.players || [];
            state.parsedPlayers = data.parsed_players || [];
            state.groups = data.groups || {};
            state.groupStats = data.group_stats || {};
            state.groupMatchesData = data.group_matches_data || {};
            state.koMatchesData = data.ko_matches_data || {};
            state.qualifiersPerGroup = data.qualifiers_per_group || 2;
            state.matchMode = data.match_mode || 'Best 3';

            if (state.parsedPlayers && state.parsedPlayers.length) {
                document.getElementById('txtNames').value = state.parsedPlayers.map(p => p.original).join('\n');
            } else {
                document.getElementById('txtNames').value = state.players.join('\n');
            }
            updatePlayerCount();
            document.getElementById(`sys${state.tournamentSystem === 'knockout' ? 'Knockout' : 'Groups'}`).checked = true;
            toggleSystemSettings();
            if (state.matchMode === 'Best 5') document.getElementById('modeB5').checked = true;
            else document.getElementById('modeB3').checked = true;

            document.getElementById('inputScreen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            
            showLiveDashboard();

            if (state.tournamentSystem === 'groups') {
                for (const gName of Object.keys(state.groups)) {
                    updateGroupTable(gName);
                    renderGroupMatches(gName);
                }
            }

            restoreSavedKOMatches();

            showToast('تم استرجاع بيانات البطولة بنجاح!');
        } catch (err) {
            showToast(`تعذر قراءة الملف: ${err.message}`, 'error');
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

function goBackToHome() {
    showModal('تأكيد الرجوع', 'هل أنت متأكد من العودة للصفحة الرئيسية؟ سيتم مسح جميع البيانات وبدء بطولة جديدة.', () => {
        state = {
            players: [],
            parsedPlayers: [],
            tournamentSystem: 'knockout',
            groups: {},
            groupStats: {},
            groupMatchesData: {},
            koMatchesData: {},
            qualifiersPerGroup: 2,
            matchMode: 'Best 3',
            activeTab: 0
        };
        koStagesUI = {};
        groupTabs = {};

        document.getElementById('txtNames').value = '';
        updatePlayerCount();
        document.getElementById('sysKnockout').checked = true;
        document.getElementById('modeB3').checked = true;
        toggleSystemSettings();

        document.getElementById('customQualifyVar').checked = false;
        document.getElementById('entGroupSize').disabled = true;

    });
}

function triggerCelebration() {
    const canvas = document.getElementById('celebrationCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    canvas.style.display = 'block';

    const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6', '#ef4444', '#38bdf8', '#facc15'];
    const particles = [];
    const fireworks = [];

    for (let f = 0; f < 5; f++) {
        const fx = Math.random() * canvas.width * 0.6 + canvas.width * 0.2;
        const fy = Math.random() * canvas.height * 0.3 + 50;
        const fColor = colors[Math.floor(Math.random() * colors.length)];
        for (let a = 0; a < 360; a += 15) {
            const rad = (a * Math.PI) / 180;
            const speed = 3 + Math.random() * 6;
            fireworks.push({
                x: fx, y: fy,
                vx: Math.cos(rad) * speed,
                vy: Math.sin(rad) * speed,
                color: fColor,
                life: 20 + Math.floor(Math.random() * 15),
                size: 3 + Math.random() * 3
            });
        }
    }

    for (let i = 0; i < 120; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: -20 - Math.random() * 200,
            w: 5 + Math.random() * 5,
            h: 8 + Math.random() * 6,
            color: colors[Math.floor(Math.random() * colors.length)],
            vy: 2 + Math.random() * 4,
            vx: -1 + Math.random() * 2,
            rotation: Math.random() * 360,
            rotSpeed: -3 + Math.random() * 6
        });
    }

    let frame = 0;
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let stillRunning = false;

        fireworks.forEach((fw) => {
            if (fw.life > 0) {
                fw.x += fw.vx;
                fw.y += fw.vy;
                fw.vy += 0.1;
                fw.life--;
                ctx.globalAlpha = fw.life / 35;
                ctx.fillStyle = fw.color;
                ctx.beginPath();
                ctx.arc(fw.x, fw.y, fw.size, 0, Math.PI * 2);
                ctx.fill();
                stillRunning = true;
            }
        });

        particles.forEach(p => {
            if (p.y < canvas.height + 20) {
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.rotSpeed;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.globalAlpha = 0.9;
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                ctx.restore();
                stillRunning = true;
            }
        });

        ctx.globalAlpha = 1;
        frame++;
        if (stillRunning && frame < 300) {
            requestAnimationFrame(animate);
        } else {
            canvas.style.display = 'none';
        }
    }
    animate();
}
